<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<link rel="stylesheet" href="base.css">
<style>
  body { width: 900px; background: #F4F6F8; padding: 28px; }
  h2 { font-size: 15px; font-weight: 700; color: #333; margin-bottom: 10px; }
  .note { font-size: 11px; color: #888; margin: -6px 0 10px; }
  .navbar {
    background: #16203A; border-radius: 6px;
    display: flex; align-items: flex-start; justify-content: center;
    gap: 8px; padding: 18px 12px 16px; margin-bottom: 26px;
  }
  .item {
    width: 118px; display: flex; flex-direction: column;
    align-items: center; gap: 9px; padding-top: 6px;
  }
  .item svg { width: 46px; height: 46px; }
  .item .lbl { color: #FFF; font-size: 13px; font-weight: 500; line-height: 1.3; text-align: center; }
  .item.new { background: rgba(30,155,216,0.16); border: 1px solid rgba(30,155,216,0.55); border-radius: 6px; padding-bottom: 8px; position: relative; }
  .item.new .badge {
    position: absolute; top: -9px; right: -6px;
    background: #1E9BD8; color: #FFF; font-size: 9px; font-weight: 700;
    padding: 2px 6px; border-radius: 8px; letter-spacing: 0.05em;
  }
  .strip { display: flex; border-radius: 6px; overflow: hidden; margin-bottom: 10px; }
  .seg { flex: 1; height: 78px; display: flex; align-items: center; justify-content: center; }
  .seg.blue { background: #1E9BD8; }
  .seg.dark { background: #17191E; }
  .seg .ko { color: #FFF; font-size: 24px; font-weight: 700; letter-spacing: -0.01em; }
  .seg .en { color: #E8EAEC; font-size: 19px; font-weight: 600; letter-spacing: 0.13em; }
</style>
</head>
<body>
  <h2>① 임상센터 · 약침소개 상단 탭 (Dermacell Booster 추가 시안)</h2>
  <p class="note">※ 기존 4개 탭은 배치 확인용 목업이며, 우측 하이라이트가 신규 제작 탭입니다.</p>
  <div class="navbar">
    <div class="item">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="16.5" y="5" width="15" height="6" rx="1.5" stroke="#FFF" stroke-width="2"/>
        <path d="M18.5 11v4M29.5 11v4" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <rect x="13.5" y="15" width="21" height="28" rx="3.5" stroke="#FFF" stroke-width="2"/>
        <text x="24" y="34" text-anchor="middle" font-family="Pretendard" font-size="10" font-weight="800" fill="#FFF">MO</text>
      </svg>
      <div class="lbl">MO조인트<br>약침</div>
    </div>
    <div class="item">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="16.5" y="5" width="15" height="6" rx="1.5" stroke="#FFF" stroke-width="2"/>
        <path d="M18.5 11v4M29.5 11v4" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <rect x="13.5" y="15" width="21" height="28" rx="3.5" stroke="#FFF" stroke-width="2"/>
        <text x="24" y="34" text-anchor="middle" font-family="Pretendard" font-size="10" font-weight="800" fill="#FFF">NM</text>
      </svg>
      <div class="lbl">NM약침</div>
    </div>
    <div class="item">
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="18" y="4" width="12" height="5" rx="1.2" stroke="#FFF" stroke-width="2"/>
        <rect x="15" y="12" width="18" height="32" rx="3" stroke="#FFF" stroke-width="2"/>
        <path d="M20 9v3M28 9v3" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
      </svg>
      <div class="lbl">수란제놀<br>약침</div>
    </div>
    <div class="item">
      <svg viewBox="0 0 48 48" fill="none">
        <ellipse cx="24" cy="8" rx="4.5" ry="4" stroke="#FFF" stroke-width="2"/>
        <rect x="19.5" y="12" width="9" height="4" rx="1" stroke="#FFF" stroke-width="2"/>
        <path d="M24 16v8" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <rect x="14" y="20" width="20" height="24" rx="3" stroke="#FFF" stroke-width="2"/>
      </svg>
      <div class="lbl">Original<br>Solution</div>
    </div>
    <div class="item new">
      <span class="badge">NEW</span>
      <svg viewBox="0 0 48 48" fill="none">
        <rect x="16.5" y="5" width="15" height="6" rx="1.5" stroke="#FFF" stroke-width="2"/>
        <path d="M18.5 11v4M29.5 11v4" stroke="#FFF" stroke-width="2" stroke-linecap="round"/>
        <rect x="13.5" y="15" width="21" height="28" rx="3.5" stroke="#FFF" stroke-width="2"/>
        <path d="M13.5 22.5h21" stroke="#FFF" stroke-width="1.2" opacity="0.55"/>
        <text x="24" y="36.5" text-anchor="middle" font-family="Pretendard" font-size="10.5" font-weight="800" letter-spacing="0.5" fill="#FFF">DB</text>
      </svg>
      <div class="lbl">Dermacell<br>Booster</div>
    </div>
  </div>

  <h2>② 메인 페이지 하단 배너 (좌: 기존 예시 / 우: 신규 시안)</h2>
  <p class="note">※ 배치 순서에 따라 블루/다크 두 가지 배경 버전을 모두 제작했습니다.</p>
  <div class="strip">
    <div class="seg blue"><div class="ko">수란제놀 약침</div></div>
    <div class="seg dark"><div class="en">DERMACELL BOOSTER</div></div>
  </div>
  <div class="strip">
    <div class="seg dark"><div class="en">ORIGINAL SOLUTION</div></div>
    <div class="seg blue"><div class="ko">더마셀 부스터 약침</div></div>
  </div>
</body>
</html>
