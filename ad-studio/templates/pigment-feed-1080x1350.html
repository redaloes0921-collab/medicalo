<style>
  /* MEDICAL O Brand Guideline ver2.0
     White / Black + Light Gray · Concept #DE3E28 (캠페인 한정)
     이탤릭·그림자·그라데이션 텍스트 이펙트 금지 */
  @font-face { font-family: 'Pretendard'; font-weight: 400; src: url('../assets/fonts/Pretendard-Regular.woff2') format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 500; src: url('../assets/fonts/Pretendard-Medium.woff2') format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 600; src: url('../assets/fonts/Pretendard-SemiBold.woff2') format('woff2'); }
  @font-face { font-family: 'Pretendard'; font-weight: 700; src: url('../assets/fonts/Pretendard-Bold.woff2') format('woff2'); }

  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { background: #dfdfe2; }
  body { font-family: 'Pretendard', 'Apple SD Gothic Neo', sans-serif; -webkit-font-smoothing: antialiased; }

  #stage {
    position: relative; width: 1080px; height: 1350px;
    background: #f6f6f7; overflow: hidden;
    word-break: keep-all; letter-spacing: -0.01em;
  }

  /* ---------- photo (right, cropped & blended) ----------
     베이스 이미지 좌측/상단의 AI 텍스트 잔상을 프레임 밖으로 크롭 */
  .photo {
    position: absolute; top: 0; right: 0; bottom: 0; width: 620px;
    overflow: hidden;
    -webkit-mask-image: linear-gradient(to right, transparent 0%, #000 36%);
            mask-image: linear-gradient(to right, transparent 0%, #000 36%);
  }
  .photo img {
    position: absolute; height: 116%; width: auto;
    top: -110px; right: -140px; display: block;
  }
  /* 바닥 쪽을 배경과 한 번 더 블렌딩 */
  .floor-blend {
    position: absolute; left: 0; right: 0; bottom: 0; height: 220px;
    background: linear-gradient(to top, rgba(246,246,247,.92), rgba(246,246,247,0));
  }

  /* ---------- content ---------- */
  .content { position: absolute; inset: 0; padding: 84px 88px; display: flex; flex-direction: column; }

  .logo { height: 30px; color: #111; }
  .logo svg { height: 100%; width: auto; display: block; }

  .campaign-tag {
    margin-top: 148px;
    display: inline-flex; align-items: center; gap: 12px;
    font-size: 26px; font-weight: 600; color: #DE3E28;
  }
  .campaign-tag::before { content: ''; width: 34px; height: 3px; background: #DE3E28; }

  h1 {
    margin-top: 34px;
    font-size: 92px; line-height: 1.22; font-weight: 700;
    letter-spacing: -0.032em; color: #111111;
  }
  h1 .thin { font-weight: 500; color: #55565a; }

  .sub {
    margin-top: 38px;
    font-size: 31px; line-height: 1.62; font-weight: 400; color: #55565a;
    max-width: 560px;
  }
  .sub b { font-weight: 600; color: #111; }

  .cta-row { margin-top: auto; display: flex; align-items: center; gap: 28px; }
  .cta {
    display: inline-flex; align-items: center; gap: 16px;
    background: #111111; color: #fff; border-radius: 999px;
    padding: 30px 52px; font-size: 33px; font-weight: 600; letter-spacing: -0.01em;
  }
  .cta .arr { font-weight: 400; transform: translateY(-1px); }
  .cta-note { font-size: 24px; color: #97989c; font-weight: 500; }

  .legal {
    position: absolute; left: 88px; bottom: 40px;
    font-size: 17px; color: #b9b9bd; font-weight: 400; letter-spacing: 0;
  }
</style>
