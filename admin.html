<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>랜딩 에디터 — MEDICAL O</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  html,body { height:100%; }
  body {
    font-family:'Helvetica Neue',Pretendard,'Apple SD Gothic Neo','Noto Sans KR','Malgun Gothic',sans-serif;
    font-size:14px; color:#1f2937; background:#eceef1;
    display:flex; flex-direction:column; overflow:hidden;
    letter-spacing:-.01em; -webkit-font-smoothing:antialiased;
  }
  button { font:inherit; cursor:pointer; }

  /* ---------- Topbar ---------- */
  .topbar {
    height:56px; flex:none; background:#fff; border-bottom:1px solid #e5e7eb;
    display:flex; align-items:center; gap:12px; padding:0 16px; z-index:10;
  }
  .topbar .back { border:0; background:none; font-size:18px; padding:6px 8px; border-radius:8px; }
  .topbar .back:hover { background:#f3f4f6; }
  .topbar h1 { font-size:16px; font-weight:700; }
  .chip { font-size:12px; background:#f3f4f6; border:1px solid #e5e7eb; border-radius:6px; padding:3px 8px; color:#6b7280; font-family:ui-monospace,monospace; }
  .topbar .sp { flex:1; }
  .tbtn {
    border:1px solid #d1d5db; background:#fff; border-radius:8px;
    padding:7px 14px; font-size:13px; font-weight:500; color:#374151;
    display:inline-flex; align-items:center; gap:6px;
  }
  .tbtn:hover { background:#f9fafb; }
  .tbtn.ghost { border-color:transparent; color:#9ca3af; }
  .tbtn.ghost:hover { color:#dc2626; background:#fef2f2; }
  .tbtn.dark { background:#111827; color:#fff; border-color:#111827; }
  .tbtn.dark:hover { background:#000; }
  .tbtn.dark.dirty { background:#2563eb; border-color:#2563eb; }
  .tbtn:disabled { opacity:.35; cursor:default; }

  /* ---------- Layout ---------- */
  .main { flex:1; display:flex; min-height:0; }

  /* ---------- Stage (preview) ---------- */
  .stage { flex:1; display:flex; flex-direction:column; min-width:0; }
  .stage-bar {
    height:44px; flex:none; display:flex; align-items:center; gap:8px; padding:0 18px;
    font-size:12px; color:#6b7280;
  }
  .stage-bar .sp { flex:1; }
  .wbtn {
    border:1px solid #d1d5db; background:#fff; border-radius:7px;
    padding:4px 10px; font-size:12px; color:#4b5563;
  }
  .wbtn.on { background:#111827; color:#fff; border-color:#111827; }
  .wbtn:disabled { opacity:.35; cursor:default; }
  .dirty-note { color:#d97706; font-weight:600; }
  .stage-body { flex:1; overflow:auto; display:flex; justify-content:center; padding:20px 24px 28px; }
  .frame-wrap { height:100%; transition:width .25s ease; width:440px; max-width:100%; }
  .frame-wrap.full { width:100%; }
  iframe {
    width:100%; height:100%; border:0; background:#fff; border-radius:4px;
    box-shadow:0 8px 40px rgba(15,23,42,.14);
  }

  /* ---------- Panel (tree) ---------- */
  .panel {
    width:580px; min-width:480px; max-width:46vw; flex:none;
    background:#f7f8fa; border-left:1px solid #e5e7eb;
    overflow-y:auto; padding:14px 14px 60px;
  }
  .guide {
    background:#eef4ff; border:1px solid #d6e4ff; color:#1e40af;
    border-radius:10px; padding:11px 14px; font-size:12.5px; line-height:1.65;
    margin-bottom:12px;
  }
  .guide b { font-weight:700; }
  .g { margin-bottom:10px; }
  .g-head {
    background:#fff; border:1px solid #e5e7eb; border-radius:10px;
    display:flex; align-items:center; gap:8px; padding:9px 10px;
  }
  .tgl { border:0; background:none; width:22px; color:#9ca3af; font-size:11px; }
  .ficon {
    width:26px; height:26px; flex:none; border-radius:6px; background:#eef2ff; color:#4f46e5;
    display:inline-flex; align-items:center; justify-content:center; font-size:13px;
  }
  .g-title { flex:1; min-width:0; font-weight:600; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
  .no { color:#2563eb; font-weight:700; margin-right:4px; font-size:13px; }
  .cnt { color:#9ca3af; font-weight:400; font-size:12px; }
  .ctrl { display:flex; align-items:center; gap:4px; flex:none; }
  .ic {
    width:26px; height:26px; border:1px solid #e5e7eb; background:#fff; border-radius:7px;
    font-size:12px; color:#6b7280; display:inline-flex; align-items:center; justify-content:center;
  }
  .ic:hover { background:#f3f4f6; color:#111827; }
  .pill {
    border:1px solid #e5e7eb; background:#fff; border-radius:7px;
    padding:4px 9px; font-size:12px; color:#374151;
  }
  .pill:hover { background:#f3f4f6; }
  .pill.danger { color:#dc2626; background:#fef2f2; border-color:#fecaca; }
  .pill.danger:hover { background:#fee2e2; }

  .g-body { padding:6px 0 2px 26px; }
  .blk { background:#fff; border:1px solid #e5e7eb; border-radius:10px; margin-bottom:7px; overflow:hidden; }
  .blk.open { border-color:#3b82f6; box-shadow:0 0 0 3px rgba(59,130,246,.12); }
  .b-head { display:flex; align-items:center; gap:8px; padding:8px 10px; cursor:pointer; user-select:none; }
  .b-head:hover { background:#fafbfc; }
  .drag { color:#d1d5db; font-size:11px; letter-spacing:-2px; }
  .bicon {
    width:26px; height:26px; flex:none; border-radius:6px; background:#f3f4f6; color:#374151;
    display:inline-flex; align-items:center; justify-content:center;
    font-size:13px; font-weight:700; overflow:hidden;
  }
  .bicon img { width:100%; height:100%; object-fit:cover; }
  .b-title { flex:1; min-width:0; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; font-size:13px; }
  .b-title .lbl { font-weight:600; }
  .snip { color:#9ca3af; font-size:12px; }

  /* ---------- Editor ---------- */
  .b-editor { border-top:1px solid #eef0f3; padding:12px 14px 14px; background:#fcfcfd; }
  .fld { margin-bottom:12px; }
  .fld > label {
    display:block; font-size:11px; font-weight:700; letter-spacing:.04em;
    color:#6b7280; margin-bottom:6px;
  }
  .fld textarea {
    width:100%; border:1px solid #d1d5db; border-radius:8px; padding:9px 11px;
    font:13px/1.6 ui-monospace,'SF Mono',Consolas,monospace; color:#111827; resize:vertical; background:#fff;
  }
  .fld textarea:focus, .fld input:focus { outline:2px solid rgba(59,130,246,.4); border-color:#3b82f6; }
  .imgrow { display:flex; gap:8px; align-items:center; }
  .ithumb {
    width:44px; height:44px; flex:none; object-fit:cover; border-radius:8px;
    border:1px solid #e5e7eb; background:#f3f4f6;
  }
  .imgrow input[type=text] {
    flex:1; min-width:0; border:1px solid #d1d5db; border-radius:8px; padding:9px 11px;
    font-size:12px; font-family:ui-monospace,monospace;
  }
  .filebtn {
    border:1px solid #3b82f6; background:#eff6ff; border-radius:8px; padding:8px 12px;
    font-size:12px; color:#1d4ed8; font-weight:600; cursor:pointer; flex:none;
  }
  .filebtn:hover { background:#dbeafe; }
  .ed-foot { display:flex; align-items:center; margin-top:4px; }
  .hint { font-size:11.5px; color:#9ca3af; flex:1; }
  .apply {
    background:#3b82f6; color:#fff; border:0; border-radius:8px;
    padding:8px 20px; font-size:13px; font-weight:600;
  }
  .apply:hover { background:#2563eb; }

  /* ---------- Toast ---------- */
  .toast {
    position:fixed; left:50%; bottom:28px; transform:translateX(-50%) translateY(20px);
    background:#111827; color:#fff; font-size:13px; padding:10px 20px; border-radius:999px;
    opacity:0; pointer-events:none; transition:all .3s ease; z-index:99;
  }
  .toast.on { opacity:1; transform:translateX(-50%); }

  @media (max-width:1100px){ .panel{ width:460px; min-width:380px; } }
</style>
</head>
<body>

  <!-- ================= TOPBAR ================= -->
  <div class="topbar">
    <button class="back" onclick="window.open('index.html')" title="페이지 열기">←</button>
    <h1>랜딩 에디터</h1>
    <span class="chip">index.html</span>
    <div class="sp"></div>
    <button class="tbtn ghost" id="btnReset">초기화</button>
    <button class="tbtn" id="btnExport">⤓ HTML 내보내기</button>
    <button class="tbtn" id="btnView">↗ 페이지 보기</button>
    <button class="tbtn dark" id="btnSave">🖫 저장</button>
  </div>

  <div class="main">
    <!-- ================= PREVIEW ================= -->
    <div class="stage">
      <div class="stage-bar">
        <span id="stageLabel">미리보기 (저장됨)</span>
        <button class="wbtn" id="btnUndo" title="되돌리기 (Ctrl+Z)" disabled>↺ 되돌리기</button>
        <button class="wbtn" id="btnRedo" title="다시실행 (Ctrl+Shift+Z)" disabled>↻ 다시실행</button>
        <div class="sp"></div>
        <button class="wbtn" data-w="390">📱 모바일 390</button>
        <button class="wbtn on" data-w="440">📱 모바일 440</button>
        <button class="wbtn" data-w="full">⛶ 전체</button>
        <button class="wbtn" id="btnReload" title="새로고침">⟳</button>
      </div>
      <div class="stage-body">
        <div class="frame-wrap" id="frameWrap">
          <iframe id="frame" src="index.html?edit=1"></iframe>
        </div>
      </div>
    </div>

    <!-- ================= PANEL ================= -->
    <div class="panel" id="panel">
      <div style="color:#9ca3af;padding:30px;text-align:center">페이지 불러오는 중…</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

<script>
(function () {
  'use strict';
  var KEY = 'medicalo_lp_state_v3';
  var frame = document.getElementById('frame');
  var panel = document.getElementById('panel');
  var stageLabel = document.getElementById('stageLabel');
  var btnSave = document.getElementById('btnSave');
  var btnUndo = document.getElementById('btnUndo');
  var btnRedo = document.getElementById('btnRedo');

  var TREE = [];
  var collapsed = {};
  var expanded = null;
  var dirty = false;
  var pendingDownload = false;

  // 실행취소/다시실행 — 상태 스냅샷 스택 (top = 현재 상태)
  var undoStack = [], redoStack = [];
  var restoring = false;      // restore 로 인한 tree 수신 시 히스토리 push 방지
  var expectHist = false;     // 블록 이동/복제/삭제 후 스냅샷 요청 플래그
  var histInit = false;
  var inlineTimer = null, inlineHistTimer = null;

  /* ---------- helpers ---------- */
  function esc(s) { return String(s == null ? '' : s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;'); }
  function escAttr(s) { return esc(s).replace(/"/g,'&quot;'); }
  function req(type, payload) {
    var msg = Object.assign({ type: type }, payload || {});
    frame.contentWindow.postMessage(msg, '*');
  }
  function toast(t) {
    var el = document.getElementById('toast');
    el.textContent = t; el.classList.add('on');
    clearTimeout(el._t); el._t = setTimeout(function(){ el.classList.remove('on'); }, 2200);
  }
  function setDirty(d) {
    dirty = d;
    stageLabel.innerHTML = d ? '미리보기 <span class="dirty-note">(저장 전 — 상단 [저장]을 눌러주세요)</span>' : '미리보기 (저장됨)';
    btnSave.classList.toggle('dirty', d);
  }
  function updateHistBtns() {
    btnUndo.disabled = undoStack.length < 2;
    btnRedo.disabled = redoStack.length < 1;
  }
  function pushHist() { req('state', { tag: 'hist' }); }
  function snip(b) {
    var f = b.fields && b.fields[0];
    if (!f) return '';
    if (f.kind === 'image') {
      if (/^data:/.test(f.value)) return '업로드 사진';
      return (f.value.split('/').pop() || '').slice(0, 24);
    }
    return f.value.replace(/<br\s*\/?>/gi, ' ').replace(/<[^>]+>/g, '').replace(/\s+/g, ' ').trim().slice(0, 22);
  }
  function findBlock(id) {
    for (var i = 0; i < TREE.length; i++)
      for (var j = 0; j < TREE[i].blocks.length; j++)
        if (TREE[i].blocks[j].id === id) return { g: TREE[i], b: TREE[i].blocks[j] };
    return null;
  }

  /* ---------- render ---------- */
  function ctlBtns(id, group) {
    return '<span class="ctrl">' +
      '<button class="ic" data-act="up" data-id="' + escAttr(id) + '" data-group="' + group + '" title="위로 이동">↑</button>' +
      '<button class="ic" data-act="down" data-id="' + escAttr(id) + '" data-group="' + group + '" title="아래로 이동">↓</button>' +
      '<button class="pill" data-act="dup" data-id="' + escAttr(id) + '" data-group="' + group + '">복제</button>' +
      '<button class="pill danger" data-act="del" data-id="' + escAttr(id) + '" data-group="' + group + '">삭제</button>' +
      '</span>';
  }
  function iconOf(b) {
    if (b.type === '이미지') {
      var f = b.fields[0];
      return '<span class="bicon"><img src="' + escAttr(f ? f.value : '') + '" onerror="this.remove()"></span>';
    }
    return '<span class="bicon">' + (b.fields.length > 1 ? '▦' : 'T') + '</span>';
  }
  function typeName(b) { return b.type === '이미지' ? '사진' : (b.fields.length > 1 ? '구성' : '텍스트'); }
  function editorHtml(b) {
    var h = '<div class="b-editor">';
    b.fields.forEach(function (f) {
      h += '<div class="fld"><label>' + esc(f.label) + '</label>';
      if (f.kind === 'image') {
        h += '<div class="imgrow">' +
          '<img class="ithumb" src="' + escAttr(f.value) + '" onerror="this.style.visibility=\'hidden\'">' +
          '<input type="text" class="fin" data-fid="' + escAttr(f.fid) + '" data-kind="image" value="' + escAttr(f.value) + '" placeholder="이미지 주소(URL) 입력 또는 오른쪽에서 파일 선택">' +
          '<label class="filebtn">📷 사진 바꾸기<input type="file" accept="image/*" data-fid="' + escAttr(f.fid) + '" hidden></label>' +
          '</div>';
      } else {
        var rows = Math.min(7, Math.max(2, Math.ceil(f.value.length / 42)));
        h += '<textarea class="fin" data-fid="' + escAttr(f.fid) + '" data-kind="html" rows="' + rows + '">' + esc(f.value) + '</textarea>';
      }
      h += '</div>';
    });
    h += '<div class="ed-foot"><span class="hint">줄바꿈은 &lt;br&gt;, 굵게는 &lt;b&gt;굵게&lt;/b&gt;</span>' +
         '<button class="apply" data-act="apply">적용</button></div></div>';
    return h;
  }
  function render() {
    var h = '<div class="guide">💡 <b>왼쪽 미리보기의 글자를 클릭하면 바로 고칠 수 있어요.</b><br>' +
      '사진은 아래 목록에서 [📷 사진 바꾸기], 순서는 ↑↓, 실수했다면 [↺ 되돌리기].<br>' +
      '수정을 마치면 꼭 상단의 <b>[저장]</b>을 눌러주세요.</div>';
    if (!TREE.length) { panel.innerHTML = h + '<div style="color:#9ca3af;padding:30px;text-align:center">블록이 없습니다.</div>'; return; }
    TREE.forEach(function (g, gi) {
      var col = collapsed[g.id];
      h += '<div class="g"><div class="g-head">' +
        '<button class="tgl" data-act="collapse" data-id="' + escAttr(g.id) + '">' + (col ? '▶' : '▼') + '</button>' +
        '<span class="ficon">▣</span>' +
        '<span class="g-title"><span class="no">' + (gi + 1) + '</span> ' + esc(g.label) +
        ' <span class="cnt">· ' + g.blocks.length + '개</span></span>' +
        ctlBtns(g.id, true) + '</div>';
      if (!col) {
        h += '<div class="g-body">';
        g.blocks.forEach(function (b, bi) {
          var open = expanded === b.id;
          h += '<div class="blk' + (open ? ' open' : '') + '" data-bid="' + escAttr(b.id) + '">' +
            '<div class="b-head" data-act="expand" data-id="' + escAttr(b.id) + '">' +
            '<span class="drag">⋮⋮</span>' + iconOf(b) +
            '<span class="b-title"><span class="no">' + (gi + 1) + '.' + (bi + 1) + '</span> ' +
            esc(typeName(b)) + ' <span class="lbl">' + esc(b.label) + '</span>' +
            (snip(b) ? ' <span class="snip">· ' + esc(snip(b)) + '</span>' : '') +
            '</span>' + ctlBtns(b.id, false) + '</div>' +
            (open ? editorHtml(b) : '') +
            '</div>';
        });
        h += '</div>';
      }
      h += '</div>';
    });
    panel.innerHTML = h;
  }

  /* ---------- events: panel ---------- */
  panel.addEventListener('click', function (e) {
    var btn = e.target.closest('[data-act]');
    if (!btn) return;
    var act = btn.dataset.act, id = btn.dataset.id, isG = btn.dataset.group === 'true';

    if (act === 'collapse') {
      collapsed[id] = !collapsed[id]; render();
    } else if (act === 'expand') {
      expanded = (expanded === id) ? null : id;
      if (expanded) req('select', { id: id, group: false });
      render();
    } else if (act === 'apply') {
      var ed = btn.closest('.b-editor');
      ed.querySelectorAll('.fin').forEach(function (inp) {
        req('update', { fid: inp.dataset.fid, kind: inp.dataset.kind, value: inp.value });
        TREE.forEach(function (g) { g.blocks.forEach(function (b) {
          b.fields.forEach(function (f) { if (f.fid === inp.dataset.fid) f.value = inp.value; });
        }); });
      });
      setDirty(true); pushHist(); render(); toast('적용됐어요 — [저장]을 눌러야 유지됩니다');
    } else if (act === 'up' || act === 'down' || act === 'dup' || act === 'del') {
      if (act === 'del') {
        var target = isG ? '이 묶음 전체를' : '이 블록을';
        if (!confirm(target + ' 삭제할까요?\n(실수해도 [↺ 되돌리기]로 복구할 수 있어요)')) return;
        if (expanded === id) expanded = null;
      }
      expectHist = true;
      req('op', { action: act, id: id, group: isG });
      setDirty(true);
    }
  });

  // 이미지 파일 업로드 → dataURL
  panel.addEventListener('change', function (e) {
    var f = e.target;
    if (f.type !== 'file' || !f.files || !f.files[0]) return;
    var reader = new FileReader();
    reader.onload = function () {
      var row = f.closest('.imgrow');
      var inp = row.querySelector('input.fin');
      var th = row.querySelector('.ithumb');
      inp.value = reader.result;
      th.src = reader.result; th.style.visibility = 'visible';
      toast('사진을 불러왔어요 — [적용]을 누르면 미리보기에 반영됩니다');
    };
    reader.readAsDataURL(f.files[0]);
  });

  /* ---------- iframe 통신 ---------- */
  var restoredThisLoad = false;
  function bootFrame() {
    if (!restoredThisLoad) {
      restoredThisLoad = true;
      try {
        var st = JSON.parse(localStorage.getItem(KEY) || 'null');
        if (st) req('restore', { state: st });
      } catch (err) {}
    }
    req('scan');
  }
  frame.addEventListener('load', function () { restoredThisLoad = false; setTimeout(bootFrame, 60); });

  window.addEventListener('message', function (e) {
    var m = e.data;
    if (!m || m.src !== 'lp') return;
    switch (m.type) {
      case 'ready':
        bootFrame();
        break;
      case 'tree':
        TREE = m.tree || [];
        if (expanded && !findBlock(expanded)) expanded = null;
        render();
        if (m.cause === 'restore' && restoring) { restoring = false; break; }
        if (!histInit) { histInit = true; pushHist(); }
        else if (expectHist) { expectHist = false; pushHist(); }
        break;
      case 'inline':
        // 미리보기 직접 편집 동기화
        TREE.forEach(function (g) { g.blocks.forEach(function (b) {
          b.fields.forEach(function (f) { if (f.fid === m.fid) f.value = m.value; });
        }); });
        setDirty(true);
        clearTimeout(inlineTimer); inlineTimer = setTimeout(render, 700);
        clearTimeout(inlineHistTimer); inlineHistTimer = setTimeout(pushHist, 1200);
        break;
      case 'picked':
        if (!m.group) {
          if (expanded === m.id) break;
          expanded = m.id;
          var loc = findBlock(m.id);
          if (loc) collapsed[loc.g.id] = false;
          render();
          var row = panel.querySelector('[data-bid="' + m.id + '"]');
          if (row) row.scrollIntoView({ behavior: 'smooth', block: 'center' });
        }
        break;
      case 'state':
        if (m.tag === 'hist') {
          var json = JSON.stringify(m.state);
          if (undoStack[undoStack.length - 1] !== json) {
            undoStack.push(json);
            if (undoStack.length > 60) undoStack.shift();
            redoStack = [];
          }
          updateHistBtns();
        } else {
          try {
            localStorage.setItem(KEY, JSON.stringify(m.state));
            setDirty(false); toast('저장 완료 ✓');
          } catch (err) {
            toast('저장 실패 — 업로드한 사진 용량이 너무 클 수 있어요');
          }
        }
        break;
      case 'html':
        if (pendingDownload) {
          pendingDownload = false;
          var blob = new Blob([m.html], { type: 'text/html;charset=utf-8' });
          var a = document.createElement('a');
          a.href = URL.createObjectURL(blob);
          a.download = 'index.html';
          a.click();
          URL.revokeObjectURL(a.href);
          toast('HTML 내보내기 완료');
        }
        break;
    }
  });

  /* ---------- 실행취소 / 다시실행 ---------- */
  function undo() {
    if (undoStack.length < 2) return;
    redoStack.push(undoStack.pop());
    restoring = true;
    req('restore', { state: JSON.parse(undoStack[undoStack.length - 1]) });
    setDirty(true); updateHistBtns();
  }
  function redo() {
    if (!redoStack.length) return;
    var s = redoStack.pop();
    undoStack.push(s);
    restoring = true;
    req('restore', { state: JSON.parse(s) });
    setDirty(true); updateHistBtns();
  }
  btnUndo.addEventListener('click', undo);
  btnRedo.addEventListener('click', redo);

  /* ---------- topbar ---------- */
  document.getElementById('btnSave').addEventListener('click', function () { req('state'); });
  document.getElementById('btnView').addEventListener('click', function () { window.open('index.html'); });
  document.getElementById('btnExport').addEventListener('click', function () { pendingDownload = true; req('export'); });
  document.getElementById('btnReset').addEventListener('click', function () {
    if (!confirm('저장된 모든 편집 내용을 지우고 처음 상태로 되돌릴까요?')) return;
    localStorage.removeItem(KEY);
    expanded = null; setDirty(false);
    undoStack = []; redoStack = []; histInit = false; updateHistBtns();
    frame.contentWindow.location.reload();
    toast('초기화되었습니다');
  });
  document.getElementById('btnReload').addEventListener('click', function () {
    if (dirty && !confirm('저장하지 않은 변경사항이 사라집니다. 새로고침할까요?')) return;
    expanded = null; setDirty(false);
    frame.contentWindow.location.reload();
  });

  /* ---------- 미리보기 폭 ---------- */
  document.querySelectorAll('.wbtn[data-w]').forEach(function (b) {
    b.addEventListener('click', function () {
      document.querySelectorAll('.wbtn[data-w]').forEach(function (x) { x.classList.remove('on'); });
      b.classList.add('on');
      var wrap = document.getElementById('frameWrap');
      if (b.dataset.w === 'full') { wrap.classList.add('full'); wrap.style.width = ''; }
      else { wrap.classList.remove('full'); wrap.style.width = b.dataset.w + 'px'; }
    });
  });

  /* ---------- 단축키 & 이탈 경고 ---------- */
  window.addEventListener('keydown', function (e) {
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 's') { e.preventDefault(); req('state'); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'z') { e.preventDefault(); e.shiftKey ? redo() : undo(); }
    if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === 'y') { e.preventDefault(); redo(); }
  });
  window.addEventListener('beforeunload', function (e) {
    if (dirty) { e.preventDefault(); e.returnValue = ''; }
  });
})();
</script>
</body>
</html>
